# Postgres local para desenvolvimento. Sobe com `npm run db:up`.
# Porta 5435 no host (só em 127.0.0.1) para não colidir com outros Postgres.
services:
  db:
    image: postgres:18-alpine
    container_name: hunt-postgres
    environment:
      POSTGRES_USER: hunt
      POSTGRES_PASSWORD: hunt
      POSTGRES_DB: hunt
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql.
      - hunt-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunt -d hunt"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  hunt-pgdata:
