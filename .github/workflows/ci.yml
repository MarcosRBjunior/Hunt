name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCT_SOURCE: mock
      LOG_LEVEL: silent
      NEXT_TELEMETRY_DISABLED: 1
      # Chaves fictícias em formato válido: o build e os testes não falam com o
      # Clerk, então o CI não precisa de segredo nenhum.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ci
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
    # Postgres dos testes de integração (mesma versão do docker-compose e do Railway).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hunt
          POSTGRES_PASSWORD: hunt
          POSTGRES_DB: hunt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hunt -d hunt_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # O postinstall roda `prisma generate` (não precisa de banco).
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma validate
        run: npx prisma validate

      - name: Testes
        run: npm run test:coverage

      # Aplica as migrations (com os CHECKs) no banco de teste e roda o contrato
      # do ProductRepository contra o Postgres.
      - name: Testes de integração
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://hunt:hunt@localhost:5432/hunt_test

      - name: Build
        run: npm run build

      # Dependências de produção. As de desenvolvimento ficam com o Dependabot
      # (hoje há um aviso sem correção em braces, via eslint-config-next).
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high
