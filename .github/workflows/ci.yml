name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCT_SOURCE: mock
      LOG_LEVEL: silent
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # prisma validate entra na Fase 4; Postgres como service container na Fase 5.

      - name: Testes
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Dependências de produção. As de desenvolvimento ficam com o Dependabot
      # (hoje há um aviso sem correção em braces, via eslint-config-next).
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high
