name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCT_SOURCE: mock
      LOG_LEVEL: silent
      NEXT_TELEMETRY_DISABLED: 1
      # Chaves fictícias em formato válido: o build e os testes não falam com o
      # Clerk, então o CI não precisa de segredo nenhum.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ci
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_aHVudC10ZXN0LXdlYmhvb2stc2VjcmV0LTMyYnl0ZXM=
    # Postgres dos testes de integração (mesma versão do docker-compose e do Railway).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hunt
          POSTGRES_PASSWORD: hunt
          POSTGRES_DB: hunt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hunt -d hunt_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # O postinstall roda `prisma generate` (não precisa de banco).
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma validate
        run: npx prisma validate

      - name: Testes
        run: npm run test:coverage

      # Aplica as migrations (com os CHECKs) no banco de teste e roda o contrato
      # do ProductRepository contra o Postgres.
      - name: Testes de integração
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://hunt:hunt@localhost:5432/hunt_test

      - name: Build
        run: npm run build

      # Dependências de produção. As de desenvolvimento ficam com o Dependabot
      # (hoje há um aviso sem correção em braces, via eslint-config-next).
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

  # TC-19 e TC-20 no navegador, com o Clerk de desenvolvimento de verdade. As
  # chaves ficam nos segredos do repositório (e nos do Dependabot, para os PRs
  # dele). PR vindo de fork não recebe segredos, então o job não roda.
  e2e:
    name: E2E (Playwright)
    needs: ci
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOG_LEVEL: warn
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEV_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      # O Clerk não alcança o CI: o segredo do webhook pode ser fictício.
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_aHVudC10ZXN0LXdlYmhvb2stc2VjcmV0LTMyYnl0ZXM=
      E2E_DATABASE_URL: postgresql://hunt:hunt@localhost:5432/hunt_e2e
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hunt
          POSTGRES_PASSWORD: hunt
          POSTGRES_DB: hunt_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hunt -d hunt_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      # O Playwright faz o build, sobe o app com PRODUCT_SOURCE=prisma, zera o
      # banco com a demo e garante os usuários de teste no Clerk.
      - name: Testes E2E
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
